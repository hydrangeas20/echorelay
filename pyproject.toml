[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echorelay"
version = "0.1.0"
description = "Streaming speech-to-text over WebSockets with faster-whisper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
]

[project.optional-dependencies]
client = ["websockets>=12"]
bench = ["websockets>=12", "jiwer>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12", "jiwer>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "whisper: requires the real faster-whisper model (downloads base.en weights)",
]
addopts = "-m 'not whisper'"
